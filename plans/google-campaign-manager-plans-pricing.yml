evidence:
  - url: https://marketingplatform.google.com/about/campaign-manager-360/
    status: 200
    finding: >-
      Product page. "Talk to Sales" is the only purchase path; no pricing tiers
      or rates are published.
    checked: '2026-08-13'
  - url: https://marketingplatform.google.com/about/campaign-manager-360/pricing/
    status: 404
    finding: >-
      The pricing URL previously recorded in this repository's apis.yml no longer
      exists. The pointer has been corrected.
    checked: '2026-08-13'
notes:
  - >-
    Supersedes a 2026-05-04 bulk-sweep scaffold that invented Free / Pro /
    Enterprise tiers with placeholder quotas. Those tiers were never published by
    Google and have been removed rather than left to be read as fact.
  - >-
    What IS published is the API quota, which is a Google Cloud project budget
    rather than a commercial plan: 50,000 requests per project per day and 1 QPS
    (raisable to 10 QPS). See rate-limits/google-campaign-manager-rate-limits.yml.
  - >-
    The prior accessModel classification of "freemium / self-serve" in apis.yml
    is not supported by anything the provider publishes; this artifact records
    the contact-sales reality.

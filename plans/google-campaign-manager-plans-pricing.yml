description: >-
  Google publishes NO plans or pricing for Campaign Manager 360 or its API. The
  product page carries a repeated "Talk to Sales" call to action and a partner
  directory, with no tiers, no rate card, no CPM schedule and no self-serve
  signup. The API is not sold separately — access comes bundled with a Campaign
  Manager 360 contract, and API quota is granted per Google Cloud project rather
  than per plan.

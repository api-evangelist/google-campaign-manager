provider: Google Campaign Manager
providerId: google-campaign-manager
description: >-
  Entity-relationship graph for Campaign Manager 360, derived from id-reference
  fields and $ref links in the v5 Discovery Document. The graph is a strict
  ownership tree rooted at Account, with a parallel measurement branch hanging
  off FloodlightConfiguration, plus a reporting branch that is deliberately
  disconnected from the trafficking tree.
id_conventions:
  type: int64 serialised as a JSON string
  prefixes: none
  note: >-
    Campaign Manager uses bare numeric IDs with no type prefix, so an ID is
    meaningless without knowing which collection it came from. Nearly every
    resource also carries a parallel *IdDimensionValue object (a DimensionValue
    with id, value, dimensionName and etag) — the reporting-side representation
    of the same identifier. Two identifier systems for one object is the single
    biggest source of confusion in this data model.
  cross_ids:
    - externalId — advertiser-supplied identifier on Campaign, Placement, PlacementGroup
    - universalAdId — cross-industry creative identifier on Creative
    - commercialId — Nielsen/TV identifier on Creative
tenancy:
  root: Account
  path_scope: /userprofiles/{profileId}/...
  note: >-
    profileId is a UserProfile, not an Account. A UserProfile binds one Google
    identity to one Account (or Subaccount); every object below is implicitly
    filtered by what that profile can see. Resolve it first with
    userProfiles.list.

aid: google-campaign-manager
name: Google Campaign Manager
description: >-
  Campaign Manager 360 is Google's ad-serving, trafficking and measurement platform for advertisers and
  agencies. Its API — service name dfareporting — lets developers programmatically manage advertisers,
  campaigns, ads, creatives, placements, floodlight conversion tags and remarketing lists, generate
  publisher ad tags, and define, run and download standard, reach, path-to-conversion, floodlight and
  cross-media reach reports. Access is OAuth 2.0 only and every path is scoped to a Campaign Manager 360
  user profile. The current version is v5; v4 has been fully sunset. Google publishes a Discovery Document
  rather than an OpenAPI, plus Data Transfer v2.0 for bulk event-level delivery to Cloud Storage.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: contact-sales
  onboarding: sales-assisted
  trial: false
  try_now: false
  public: false
  label: Contact sales · Campaign Manager 360 contract required
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected 2026-08-13. Google publishes no plans or pricing for Campaign Manager 360; the product page
    offers only "Talk to Sales". The prior freemium/self-serve classification came from a 2026-05-04 plans
    scaffold that has since been replaced with the searched finding.

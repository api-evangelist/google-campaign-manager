description: >-
  First-party Google client libraries that carry the Campaign Manager 360 API
  (dfareporting). Google ships these two ways: broad multi-API clients that
  generate every Google API surface from the Discovery Document (googleapis on
  npm, google-api-python-client on PyPI, google-api-go-client, google/apiclient
  on Packagist), and per-version service packages that carry dfareporting
  explicitly (Maven google-api-services-dfareporting, NuGet
  Google.Apis.Dfareporting.vN, RubyGems google-apis-dfareporting_vN, npm
  @googleapis/dfareporting). Versions and publish dates below were read from each
  registry's metadata endpoint on 2026-08-13.
notes:
  - >-
    VERSION-DECAY SIGNAL: the per-version packages make the v4 sunset legible.
    Google.Apis.Dfareporting.v4 last published 2026-05-19 and
    google-apis-dfareporting_v4 last published 2026-05-24, while their v5
    siblings continue to ship (2026-07-28 and 2026-07-26). The v4 REST surface
    itself is already dead at the host — https://dfareporting.googleapis.com/dfareporting/v4/userprofiles
    returns HTTP 404. Any consumer still pinned to a v4 package is calling a
    retired API.
  - >-
    Google publishes no dfareporting-specific package on PyPI, Packagist or
    pkg.go.dev; those ecosystems reach Campaign Manager 360 through the umbrella
    client plus a generated service module.

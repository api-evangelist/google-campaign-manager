  note: >-
    No Campaign-Manager-360-specific certification page is published. Google's
    corporate compliance program (SOC 2, ISO 27001, ISO 27701) is documented for
    Google Cloud and Google Workspace, not for the Marketing Platform API
    surface, so no Compliance pointer is asserted for this provider.
